[package]
name = "nishesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Team Unallocated, National Forensic Sciences University"]
description = "Integrated secure data erasure and advanced file recovery for digital forensics and data sanitization"
license = "Apache-2.0"
repository = "https://github.com/RoyGitDigger/nishesh"

# ---------------------------------------------------------------------------
# NO THIRD-PARTY DEPENDENCIES IN THE CORE.
#
# This is deliberate, not a limitation. NISHESH is intended for air-gapped
# deployment in forensic and disposal environments where the entire software
# bill of materials must be auditable by the deploying organisation. Every
# algorithm below is implemented in-tree against its published specification
# and covered by test vectors:
#
#   SHA-256          FIPS 180-4          src/hash.rs
#   HMAC-SHA256      RFC 2104            src/hash.rs
#   Aho-Corasick     CACM 18(6), 1975    src/carve.rs
#   JSON canonical   RFC 8785 (JCS)      src/json.rs
#   Merkle log       RFC 6962 §2         src/proof.rs
#   NTFS on-disk     MS-FSCC / ntfsdoc   src/ntfs.rs
#   FAT32 on-disk    MS EFI FAT32 spec   src/fat.rs
#
# ONE exception is planned and documented: Ed25519 signing (RFC 8032) is NOT
# hand-rolled. Hand-rolling asymmetric cryptography is malpractice. See
# src/proof.rs::Signer — Phase 2 wires ed25519-dalek behind that trait.
# ---------------------------------------------------------------------------
[dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
